<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#24242F"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B57D0"/>
      <stop offset="50%" stop-color="#6750A4"/>
      <stop offset="100%" stop-color="#E95420"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 基础圆形托底 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- 显示屏 1 (主屏 4K - 偏左侧大尺寸) -->
  <g filter="url(#shadow)">
    <!-- 屏幕外壳 -->
    <rect x="48" y="100" width="260" height="180" rx="16" fill="#2E2E38" stroke="#484856" stroke-width="4"/>
    <!-- 屏幕显示区域 -->
    <rect x="56" y="108" width="244" height="164" rx="10" fill="url(#screen1)"/>
    <!-- 壁纸太阳与山脉风光几何抽象 -->
    <circle cx="120" cy="160" r="26" fill="#FFF" opacity="0.85"/>
    <path d="M 56 240 Q 140 180, 200 220 T 300 200 L 300 272 L 56 272 Z" fill="#181822" opacity="0.6"/>
    <!-- 主屏金色角标 -->
    <circle cx="76" cy="128" r="8" fill="#F59E0B"/>
    <!-- 显示器底座与支架 -->
    <rect x="166" y="280" width="24" height="42" fill="#3D3D4A"/>
    <rect x="130" y="322" width="96" height="10" rx="5" fill="#4B4B5A"/>
  </g>

  <!-- 显示屏 2 (副屏 2K - 偏右侧稍小尺寸，立体叠加) -->
  <g filter="url(#shadow)">
    <!-- 屏幕外壳 -->
    <rect x="256" y="140" width="208" height="152" rx="14" fill="#262630" stroke="#525262" stroke-width="4"/>
    <!-- 屏幕显示区域 -->
    <rect x="264" y="148" width="192" height="136" rx="8" fill="url(#screen2)"/>
    <!-- 壁纸极光几何抽象 -->
    <circle cx="380" cy="185" r="20" fill="#E0F2FE" opacity="0.9"/>
    <path d="M 264 260 Q 320 210, 380 235 T 456 220 L 456 284 L 264 284 Z" fill="#064E3B" opacity="0.7"/>
    <!-- 显示器底座与支架 -->
    <rect x="350" y="292" width="20" height="40" fill="#3D3D4A"/>
    <rect x="320" y="332" width="80" height="10" rx="5" fill="#4B4B5A"/>
  </g>

  <!-- 连接徽标与多屏联动光桥 -->
  <path d="M 200 370 Q 256 400, 312 370" fill="none" stroke="#E95420" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>
  <circle cx="256" cy="384" r="8" fill="#E95420"/>
</svg>
